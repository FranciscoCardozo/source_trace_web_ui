<section class="results-container">
  <header class="page-heading">
    <h1>Validar análisis</h1>
    <p>Consulta el estado de un análisis con su identificador y revisa los resultados.</p>
  </header>

  <mat-card class="lookup-card">
    <mat-form-field appearance="outline" class="lookup-field">
      <mat-label>Identificador del análisis (jobId)</mat-label>
      <input
        matInput
        [(ngModel)]="jobId"
        [disabled]="loading"
        placeholder="a1b2c3"
        (keyup.enter)="consult()"
      />
      <mat-icon matSuffix>tag</mat-icon>
    </mat-form-field>

    <button
      mat-flat-button
      color="primary"
      [disabled]="!jobId.trim() || loading"
      (click)="consult()"
    >
      <mat-icon>search</mat-icon>
      Consultar
    </button>
  </mat-card>

  <div class="state-block" *ngIf="loading">
    <mat-spinner diameter="32"></mat-spinner>
    <span>Consultando estado...</span>
  </div>

  <mat-card class="feedback-card error" *ngIf="error && !loading">
    <mat-icon>error_outline</mat-icon>
    <span>{{ error }}</span>
  </mat-card>

  <ng-container *ngIf="result && !loading">
    <app-summary [result]="result" (refresh)="consult()"></app-summary>
    <app-evidence [evidences]="result.evidences"></app-evidence>
  </ng-container>
</section>
